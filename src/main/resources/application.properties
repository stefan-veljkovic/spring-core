spring.application.name=spring-core
# ===================================================================
# 1. H2 DATASOURCE CONFIGURATION
# ===================================================================
# In-memory database (data is lost when the app stops)
spring.datasource.url=jdbc:h2:mem:testdb

# OR File-based database (data persists between restarts)
# spring.datasource.url=jdbc:h2:file:~/spring-boot-h2-db

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# 2. HIBERNATE / JPA CONFIGURATION
# ===================================================================
# Directs how Hibernate manages the database schema creation
spring.jpa.hibernate.ddl-auto=update

# Ensures Hibernate maps data types accurately to H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Prints SQL statements to the console log (useful for debugging)
spring.jpa.show-sql=true

# Formats SQL queries cleanly in the console
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 3. H2 WEB CONSOLE CONFIGURATION (Optional but recommended)
# ===================================================================
# Enables the browser-based H2 database console UI
spring.h2.console.enabled=true

# Changes the default endpoint from /h2-console to /h2
spring.h2.console.path=/h2